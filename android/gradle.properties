org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Project path contains non-ASCII characters (中文目录名), which AGP would
# otherwise reject on Windows. Overriding the check is safe for this project.
android.overridePathCheck=true
# Pub cache lives on C: while the project lives on D:; Kotlin incremental
# compilation cannot resolve relative paths across drives, so disable it.
kotlin.incremental=false
# AGP 9 transitional mode: keep built-in Kotlin disabled while using current KGP.
# This mode is supported by Flutter 3.44+ during the migration period.
android.newDsl=false
android.builtInKotlin=false
