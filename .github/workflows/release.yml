name: Build and Release QSLMM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qslmm-release-main
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build signed APK and publish Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Read application version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Determine the next semantic version by incrementing the latest
          # release tag. Each segment is a single digit (0-9) that carries at
          # 10, so 0.3.9 -> 0.4.0 and 0.9.9 -> 1.0.0.
          LATEST_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' 2>/dev/null || true)"
          LATEST_TAG="${LATEST_TAG#v}"

          if [[ -n "$LATEST_TAG" ]]; then
            # Drop any trailing +buildNumber left over from the previous scheme.
            SEMVER="${LATEST_TAG%%+*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$SEMVER"
            PATCH=$(( ${PATCH:-0} + 1 ))
            if (( PATCH >= 10 )); then
              PATCH=0
              MINOR=$(( ${MINOR:-0} + 1 ))
            fi
            if (( MINOR >= 10 )); then
              MINOR=0
              MAJOR=$(( ${MAJOR:-0} + 1 ))
            fi
          else
            # No previous release: seed the version from pubspec.yaml.
            VERSION_LINE="$(grep -E '^version:[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?[[:space:]]*$' pubspec.yaml | head -n 1)"
            VERSION="$(printf '%s\n' "$VERSION_LINE" | sed -E 's/^version:[[:space:]]+//; s/[[:space:]]+$//')"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION%%+*}"
          fi

          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"

          # Android versionCode must be a monotonically increasing integer.
          BUILD_NUMBER=$(( MAJOR * 100 + MINOR * 10 + PATCH ))

          RELEASE_VERSION="${VERSION_NAME}"
          APK_NAME="QSLMM-v${RELEASE_VERSION}.apk"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "Building QSLMM $RELEASE_VERSION"

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing secret: ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'Missing secret: ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'Missing secret: ANDROID_KEY_ALIAS'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'Missing secret: ANDROID_KEY_PASSWORD'; exit 1; }

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/qslmm-release.jks
          cat > android/key.properties <<PROPS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=qslmm-release.jks
          PROPS

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name "${{ steps.version.outputs.version_name }}" \
            --build-number "${{ steps.version.outputs.build_number }}"

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}"

      - name: Create SHA-256 checksum
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum "${{ steps.version.outputs.apk_name }}" > "${{ steps.version.outputs.apk_name }}.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.release_version }}"
          name: "QSLMM v${{ steps.version.outputs.release_version }}"
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}
            build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}.sha256
